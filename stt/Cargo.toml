[package]
name = "e-voice-stt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice speech-to-text: CPU-first pipeline (wake word, VAD, ASR, SER) behind OpenAI-compatible APIs"
license = "MIT"

[lib]
name = "e_voice_stt"

[[bin]]
name = "e-voice"
path = "src/main.rs"

[dependencies]
audioadapter-buffers = "5.2.0"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.23.1"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
humantime-serde = "1.1.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27", "tracing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rubato = "5.0.1"
sentencepiece = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "mkv", "opt-simd"] }
symphonia-adapter-libopus = "0.3.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
futures-util = "0.3.34"
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json"] }
serde_json = "1.0.151"
tokio-tungstenite = "0.30.0"
wiremock = "0.6.5"

[lints]
workspace = true
