[package]
name = "e-voice-stt"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice speech-to-text: CPU-first pipeline (wake word, VAD, ASR, SER) behind OpenAI-compatible APIs"
license = "MIT"
build = "../core/link.rs"

[lib]
name = "e_voice_stt"

[[bin]]
name = "e-voice"
path = "src/main.rs"

[dependencies]
e-voice-core = { path = "../core" }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = "0.3.34"
humantime-serde = "1.1.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27", "tracing"] }
sentencepiece = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
futures-util = "0.3.34"
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json"] }
serde_json = "1.0.151"
tokio-tungstenite = "0.30.0"
wiremock = "0.6.5"

[lints]
workspace = true
