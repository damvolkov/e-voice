[package]
name = "e-voice-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "e-voice shared core: settings, model store, onnxruntime binding, audio I/O, logging"
license = "MIT"

[lib]
name = "e_voice_core"

[dependencies]
audioadapter-buffers = "5.2.0"
bzip2 = "0.6.1"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27", "tracing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "mkv", "opt-simd"] }
symphonia-adapter-libopus = "0.3.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
walkdir = "2.5.0"

[dev-dependencies]
figment = { version = "0.10.19", features = ["test", "toml", "env"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
wiremock = "0.6.5"

[lints]
workspace = true
