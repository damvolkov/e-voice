##### CI #####
# Same gate as the local prek hooks, plus the runtime image build. Model-backed tests and the
# coverage gate need the 1.7 GB model volume and run on pre-push instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: hooks (fmt, clippy, bounds, tests, gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> data/ops/target"
      - name: system packages, pinned toolchain, sherpa
        run: make system toolchain sherpa OS=ubuntu
      - name: prek
        run: make hooks

  image:
    name: runtime image (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [full, stt]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.mode }}
          push: false
          tags: e-voice:${{ matrix.mode }}
