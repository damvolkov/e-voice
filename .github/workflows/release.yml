##### RELEASE #####
# Per-service, git-first releases: every image has its own version and tag (stt-vX.Y.Z, tts-vX.Y.Z,
# full-vX.Y.Z). A release names the service that changed; e-voice-full, which ships both, is bumped with
# either. A service without a tag of its own starts from the last plain vX.Y.Z (v0.2.0). Each image job is
# inert until its gate is on (see .github/ci.vars.example).
name: release

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service that changed (full is always released with it)
        type: choice
        default: stt
        options: [stt, tts, both]
      bump:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: versions + tags
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.next.outputs.ref }}
      stt: ${{ steps.next.outputs.stt }}
      tts: ${{ steps.next.outputs.tts }}
      full: ${{ steps.next.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: next
        name: next version of every released image, tags pushed, releases opened
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ inputs.service }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          next() {
            local image="$1" last base M m p
            last="$(git tag -l "${image}-v*" --sort=-v:refname | head -1)"
            base="${last#"${image}-v"}"
            [ -n "$last" ] || base="$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')"
            [ -n "$base" ] || base=0.0.0
            IFS=. read -r M m p <<< "$base"
            case "$BUMP" in
              major) M=$((M+1)); m=0; p=0 ;;
              minor) m=$((m+1)); p=0 ;;
              *) p=$((p+1)) ;;
            esac
            echo "$M.$m.$p ${last:-v$base}"
          }
          case "$SERVICE" in
            stt) images="stt full" ;;
            tts) images="tts full" ;;
            *) images="stt tts full" ;;
          esac
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          auth="AUTHORIZATION: basic $(printf '%s:%s' 'x-access-token' "$GH_TOKEN" | base64 -w0)"
          for image in $images; do
            read -r version previous <<< "$(next "$image")"
            tag="${image}-v${version}"
            git tag "$tag"
            git -c "http.https://github.com/.extraheader=${auth}" push origin "$tag"
            latest=false
            [ "$image" = full ] && latest=true
            gh release create "$tag" --title "e-voice-${image} ${version}" --latest="$latest" \
              --verify-tag --generate-notes --notes-start-tag "$previous"
            echo "${image}=${version}" >> "$GITHUB_OUTPUT"
          done

  image-stt:
    name: image · e-voice-stt
    if: vars.PUBLISH_IMAGE == 'true' && needs.bump.outputs.stt != ''
    needs: bump
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-voice-stt
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.bump.outputs.stt }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.bump.outputs.stt }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=e-voice-stt
            org.opencontainers.image.description=CPU-first speech-to-text service with emotion, OpenAI/Deepgram/ElevenLabs compatible
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.stt
          build-args: VERSION=${{ needs.bump.outputs.stt }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  image-tts:
    name: image · e-voice-tts
    if: vars.PUBLISH_IMAGE == 'true' && needs.bump.outputs.tts != ''
    needs: bump
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-voice-tts
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.bump.outputs.tts }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.bump.outputs.tts }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=e-voice-tts
            org.opencontainers.image.description=CPU-first streaming text-to-speech with learned voices (Qwen3 by default), OpenAI compatible
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.tts
          build-args: VERSION=${{ needs.bump.outputs.tts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  image-full:
    name: image · e-voice-full
    if: vars.PUBLISH_IMAGE == 'true' && needs.bump.outputs.full != ''
    needs: bump
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/e-voice-full
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.bump.outputs.full }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.bump.outputs.full }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=e-voice-full
            org.opencontainers.image.description=e-voice STT (:5500) and TTS (:5600) in one container
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.full
          build-args: VERSION=${{ needs.bump.outputs.full }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
