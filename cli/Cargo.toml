[package]
name = "ecli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Terminal tester for e-voice: streams the microphone to /v1/stream and prints transcripts"
license = "MIT"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
futures-util = "0.3.34"
hound = "3.5.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
